[package]
name = "baliset"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A native Spotify client built with Rune"
default-run = "baliset"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "60df96d0142c0152b5ab598bf460b4addaed4728" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "60df96d0142c0152b5ab598bf460b4addaed4728" }
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-connect = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-metadata = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-protocol = "0.8"
protobuf = "3"
librespot-playback = { version = "0.8", default-features = false, features = ["rodio-backend", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
futures-util = "0.3"
http = "1"
bytes = "1"
http-body-util = "0.1"
form_urlencoded = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
open = "5"
log = "0.4"
zbus = { version = "6", default-features = false, features = ["tokio"] }
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"

[[bin]]
name = "baliset-engine"
path = "src/bin/baliset-engine.rs"
required-features = ["spotify"]

[features]
default = ["spotify"]
# The real Spotify engine. Off, only the demo engine is built.
spotify = []

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
codegen-units = 16
incremental = true
